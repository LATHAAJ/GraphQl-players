name: Trigger Documentation Update

on:
  push:
    paths:
      - 'src/main/resources/graphql/schema.graphql'
    branches: [main, documentGeneration]
  workflow_dispatch:

jobs:
  trigger-docs-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if DOCS_REPO_TOKEN exists
        run: |
          if [ -z "${{ secrets.DOCS_REPO_TOKEN }}" ]; then
            echo "❌ DOCS_REPO_TOKEN secret is not set!"
            echo "Please add DOCS_REPO_TOKEN secret to this repository"
            exit 1
          else
            echo "✅ DOCS_REPO_TOKEN secret is configured"
          fi

      - name: Trigger documentation repository dispatch
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          repository: LATHAAJ/graphql-api-docs
          event-type: update-docs
          client-payload: |
            {
              "commit_id": "${{ github.sha }}",
              "repository": "${{ github.repository }}",
              "ref": "${{ github.ref }}",
              "workflow": "${{ github.workflow }}",
              "triggered_at": "${{ github.event.head_commit.timestamp }}",
              "branch": "${{ github.ref_name }}"
            }
